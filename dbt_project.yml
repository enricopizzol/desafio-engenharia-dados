name: cdv_dbt_challenge
version: "1.0.0"
config-version: 2
profile: cdv_dbt_challenge

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets: ["target", "dbt_packages", "logs"]

flags:
  send_anonymous_usage_stats: false

# Todas as alternativas do doc de decisões (decisoes.md) são controladas por
# estas variáveis. Os valores abaixo são o comportamento padrão.
vars:
  # D3: severidade do teste singular de posição negativa (warn | error)
  negative_position_severity: warn
  # D3 (alternativa "limiares"): condições do dbt para warn/error.
  # error_if só é avaliado quando a severidade é error.
  negative_position_warn_if: "!= 0"
  negative_position_error_if: "!= 0"
  # D4: severidade dos testes de qualidade da fonte, nos seeds (warn | error)
  source_quality_severity: warn
  # D9: T035/T036 — false mantém as duas e marca; true deduplica pelo conteúdo
  dedup_transactions_by_content: false
  # D11 (rejeitada, só para demonstração): esconder posições negativas no mart
  portfolio_hide_negative_positions: false
  # D13: incremental da fact
  fact_incremental_strategy: delete+insert   # delete+insert | merge | append
  fact_lookback_days: 3

seeds:
  cdv_dbt_challenge:
    # D7: seeds carregados como texto; a tipagem acontece no staging.
    # Os tipos ficam por seed: o dbt avisa quando uma coluna listada não existe no CSV.
    transactions:
      +column_types:
        transaction_id: varchar
        client_id: varchar
        asset_ticker: varchar
        operation: varchar
        quantity: varchar
        unit_price: varchar
        transaction_date: varchar
    clients:
      +column_types:
        client_id: varchar
        name: varchar
        city: varchar
        state: varchar
        created_at: varchar

models:
  cdv_dbt_challenge:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

data_tests:
  cdv_dbt_challenge:
    +store_failures: true
