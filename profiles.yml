# Fica na raiz do projeto: o dbt procura profiles.yml no diretório atual antes
# de ~/.dbt, então quem avalia não precisa configurar nada.
cdv_dbt_challenge:
  target: dev
  outputs:
    # DuckDB em arquivo local; o caminho pode ser trocado com DBT_DUCKDB_PATH.
    dev:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', 'cdv.duckdb') }}"
      threads: 4

    # Postgres: exige `pip install -r requirements-postgres.txt`
    # e um Postgres rodando (docker compose up -d). Uso: dbt build --target postgres
    postgres:
      type: postgres
      host: "{{ env_var('PGHOST', 'localhost') }}"
      port: "{{ env_var('PGPORT', '5432') | int }}"
      user: "{{ env_var('PGUSER', 'dbt') }}"
      password: "{{ env_var('PGPASSWORD', 'dbt') }}"
      dbname: "{{ env_var('PGDATABASE', 'cdv') }}"
      schema: public
      threads: 4
