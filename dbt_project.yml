name: cdv_dbt_challenge
version: "1.0.0"
config-version: 2
profile: cdv_dbt_challenge

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets: ["target", "dbt_packages", "logs"]

flags:
  send_anonymous_usage_stats: false

# Valores padrão das variáveis do projeto; podem ser trocados com --vars.
vars:
  # Severidade do teste assert_no_negative_position: warn ou error
  negative_position_severity: warn
  # Quantidade de linhas que dispara o aviso e o erro desse teste.
  # O error_if só é avaliado quando a severidade é error.
  negative_position_warn_if: "!= 0"
  negative_position_error_if: "!= 0"
  # Severidade dos testes de qualidade dos seeds: warn ou error
  source_quality_severity: warn
  # true: transações com o mesmo conteúdo ficam só com a de menor ID
  dedup_transactions_by_content: false
  # true: o mart_client_portfolio remove as posições com net_quantity negativa
  portfolio_hide_negative_positions: false
  # Dias reprocessados a cada execução incremental da fact_transactions
  fact_lookback_days: 3

seeds:
  cdv_dbt_challenge:
    # Todas as colunas dos seeds são carregadas como texto; a tipagem é feita no staging.
    # Os tipos são definidos por seed porque o dbt avisa quando uma coluna listada não existe no CSV.
    transactions:
      +column_types:
        transaction_id: varchar
        client_id: varchar
        asset_ticker: varchar
        operation: varchar
        quantity: varchar
        unit_price: varchar
        transaction_date: varchar
    clients:
      +column_types:
        client_id: varchar
        name: varchar
        city: varchar
        state: varchar
        created_at: varchar

models:
  cdv_dbt_challenge:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

data_tests:
  cdv_dbt_challenge:
    +store_failures: true
