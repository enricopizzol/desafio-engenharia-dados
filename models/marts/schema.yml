version: 2

# Marts com contrato aplicado (D16): nomes e tipos das colunas são garantidos
# no build; uma mudança de tipo quebra o `dbt run` em vez de chegar ao consumidor.

models:
  - name: fact_transactions
    description: >
      Fato de transações. Grão: uma linha por transação válida (98 hoje).
      Incremental com janela de reprocessamento (D13).
    config:
      contract: {enforced: true}
    columns:
      - name: transaction_id
        description: "{{ doc('transaction_id') }}"
        data_type: text
        constraints: [{type: not_null}]
        data_tests: [unique, not_null]
      - name: client_id
        description: "{{ doc('client_id') }}"
        data_type: text
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_clients')
                field: client_id
      - name: asset_ticker
        description: "{{ doc('asset_ticker') }}"
        data_type: text
        data_tests: [not_null]
      - name: operation_type
        description: "{{ doc('operation_type') }}"
        data_type: text
        data_tests:
          - accepted_values:
              arguments:
                values: ['BUY', 'SELL']
      - name: transaction_date
        description: "{{ doc('transaction_date') }}"
        data_type: date
        data_tests: [not_null]
      - name: quantity
        description: "{{ doc('quantity') }}"
        data_type: integer
        data_tests: [positive_value]
      - name: signed_quantity
        description: "{{ doc('signed_quantity') }}"
        data_type: integer
      - name: unit_price
        description: "{{ doc('unit_price') }}"
        data_type: decimal(18,4)
        data_tests: [positive_value]
      - name: gross_amount
        description: "{{ doc('gross_amount') }}"
        data_type: decimal(18,2)
      - name: signed_amount
        description: "{{ doc('signed_amount') }}"
        data_type: decimal(18,2)
      - name: is_possible_duplicate
        description: "{{ doc('is_possible_duplicate') }}"
        data_type: boolean

  - name: dim_clients
    description: >
      Dimensão de clientes. Grão: uma linha por cliente (25), inclusive os que
      nunca operaram (C11 a C25).
    config:
      contract: {enforced: true}
    columns:
      - name: client_id
        description: "{{ doc('client_id') }}"
        data_type: text
        constraints: [{type: not_null}]
        data_tests: [unique, not_null]
      - name: client_name
        description: Nome do cliente.
        data_type: text
      - name: city
        description: Cidade do cliente.
        data_type: text
      - name: state
        description: UF do cliente.
        data_type: text
      - name: client_created_date
        description: Data de cadastro do cliente.
        data_type: date
      - name: first_transaction_date
        description: Data da primeira transação válida. Nula se o cliente nunca operou.
        data_type: date
      - name: last_transaction_date
        description: Data da última transação válida. Nula se o cliente nunca operou.
        data_type: date
      - name: total_transactions
        description: Número de transações válidas do cliente.
        data_type: bigint
        data_tests: [not_null]
      - name: has_transactions
        description: Verdadeiro se o cliente tem ao menos uma transação válida.
        data_type: boolean
        data_tests: [not_null]

  - name: mart_client_portfolio
    description: >
      Portfólio consolidado. Grão: cliente + ativo. Inclui posições zeradas e
      negativas, identificadas por position_status; o teste singular
      assert_no_negative_position aponta as negativas (D3, D11).
    config:
      contract: {enforced: true}
    columns:
      - name: portfolio_key
        description: Chave do grão, `client_id|asset_ticker`. Permite testar unicidade sem dbt_utils.
        data_type: text
        constraints: [{type: not_null}]
        data_tests: [unique, not_null]
      - name: client_id
        description: "{{ doc('client_id') }}"
        data_type: text
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_clients')
                field: client_id
      - name: asset_ticker
        description: "{{ doc('asset_ticker') }}"
        data_type: text
      - name: net_quantity
        description: Posição líquida em quantidade, comprado menos vendido.
        data_type: bigint
        data_tests: [not_null]
      - name: net_amount
        description: "{{ doc('net_amount') }}"
        data_type: decimal(18,2)
      - name: total_bought_quantity
        description: Quantidade total comprada.
        data_type: bigint
      - name: total_sold_quantity
        description: Quantidade total vendida.
        data_type: bigint
      - name: total_bought_amount
        description: Valor total comprado, em reais.
        data_type: decimal(18,2)
      - name: total_sold_amount
        description: Valor total vendido, em reais.
        data_type: decimal(18,2)
      - name: avg_buy_price
        description: Preço médio de compra ponderado pela quantidade. Nulo se o cliente só vendeu o ativo.
        data_type: decimal(18,4)
      - name: first_transaction_date
        description: Data da primeira transação do cliente no ativo.
        data_type: date
      - name: last_transaction_date
        description: Data da última transação do cliente no ativo.
        data_type: date
      - name: total_transactions
        description: Número de transações do cliente no ativo.
        data_type: bigint
      - name: position_status
        description: "`open` (quantidade > 0), `closed` (= 0) ou `negative` (< 0, vendeu mais do que comprou)."
        data_type: text
        data_tests:
          - accepted_values:
              arguments:
                values: ['open', 'closed', 'negative']
